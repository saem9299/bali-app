<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جالان — وين نروح اليوم؟</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%231B5E4A'/%3E%3Cpath d='M8 30c0-11 9-19 19-19' stroke='%23F4EFE6' stroke-width='3.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='27' cy='11' r='4' fill='%23C89B3C'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1B5E4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="جالان">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="hdr">
  <div class="brand">
    <span class="lock">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#1B5E4A"/>
      <path d="M8 30c0-11 9-19 19-19" stroke="#F4EFE6" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <circle cx="27" cy="11" r="4" fill="#C89B3C"/></svg>
      <span class="word"><h1>جالان</h1><em>وين نروح اليوم؟</em></span>
    </span><span id="total" class="num"></span>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="ابحث عن مطعم، رياضة، مشروب أو منطقة" autocomplete="off">
    <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </div>
  <div class="chips" id="areaChips"></div>
</header>

<div class="bar" id="toolbar">
  <div class="seg" id="sortSeg">
    <button data-s="best" aria-pressed="true">الأنسب</button>
    <button data-s="rating" aria-pressed="false">التقييم</button>
    <button data-s="near" aria-pressed="false">الأقرب</button>
    <button data-s="pop" aria-pressed="false">الأشهر</button>
  </div>
  <button class="tbtn" id="filtBtn">فلاتر</button>
  <div class="spacer"></div>
  <button class="tbtn" id="mapBtn">خريطة</button>
</div>
<div class="count num" id="count"></div>
<main class="wrapmax"><div id="list"></div>
  <div id="mapwrap">
    <button id="mapCloseX" class="mapclose" aria-label="إغلاق الخريطة">✕</button>
    <div id="map"></div><div id="mapbanner"></div>
    <div id="mapstatus"></div>
  </div>
</main>
<nav id="tabs"></nav>

<div class="sheet" id="detail"><div class="scrim" data-close></div>
  <button class="sheetx" data-close aria-label="إغلاق">✕</button>
  <div class="panel" id="dpanel"></div></div>
<div class="sheet" id="filters"><div class="scrim" data-close></div><div class="panel" id="fpanel"></div></div>
<div class="sheet" id="more"><div class="scrim" data-close></div><div class="panel" id="mpanel"></div></div>
<div class="sheet" id="plan"><div class="scrim" data-close></div><div class="panel" id="ppanel"></div></div>
<div class="sheet" id="near"><div class="scrim" data-close></div><div class="panel" id="npanel"></div></div>
<div class="sheet" id="flow"><div class="scrim" data-close></div><div class="panel" id="wpanel"></div></div>
<div class="sheet" id="mapcard"><div class="scrim" data-close></div>
  <button class="sheetx" data-close aria-label="إغلاق">✕</button>
  <div class="panel" id="mcpanel"></div></div>
<div class="sheet" id="regionSel"><div class="scrim" data-close></div>
  <button class="sheetx" data-close aria-label="إغلاق">✕</button>
  <div class="panel" id="rspanel"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="data/places.generated.js"></script>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
